<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast Darurat - AsyrofOTP</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --panel-bg: #18181b;
            --border: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
            --code-bg: #000000;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg-dark); color: var(--text-main);
            margin: 0; padding: 40px 20px;
            display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
        }
        .panel {
            background-color: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 12px; width: 100%; max-width: 800px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); overflow: hidden;
        }
        .panel-header {
            background-color: #1f1f22; padding: 15px 25px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .panel-header h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px;}
        .panel-header .badge { background: var(--danger); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .panel-body { padding: 25px; }
        table.form-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; border: 1px solid var(--border); }
        table.form-table th, table.form-table td { padding: 15px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
        table.form-table th { width: 25%; font-weight: 600; color: var(--text-muted); font-size: 14px; background: #171717; }
        table.form-table tr:last-child td { border-bottom: none; }
        input[type="password"], textarea {
            width: 100%; padding: 12px 15px; background-color: var(--code-bg); border: 1px solid var(--border);
            color: var(--success); border-radius: 6px; font-family: monospace; font-size: 14px; transition: border 0.2s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        textarea { resize: vertical; min-height: 120px; }
        .btn-execute {
            width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; color: white; background-color: var(--danger);
            display: block; text-align: center; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px;
        }
        .btn-execute:hover:not(:disabled) { background-color: #dc2626; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .btn-execute:disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; }
        .console-box { border: 1px solid var(--border); border-radius: 8px; background-color: var(--code-bg); overflow: hidden; }
        .console-header { background-color: #111; padding: 8px 15px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); display: flex; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.red { background: #ff5f56; } .dot.yellow { background: #ffbd2e; } .dot.green { background: #27c93f; }
        .console-body { padding: 15px; height: 250px; overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.5; color: var(--text-main); }
        .log-error { color: var(--danger); } .log-success { color: var(--success); } .log-info { color: var(--accent); }
    </style>
</head>
<body>

<div class="panel">
    <div class="panel-header">
        <h2><span class="badge">DANGER</span> Broadcast System</h2>
    </div>
    <div class="panel-body">
        <table class="form-table">
            <thead><tr><th>Parameter</th><th>Value Input</th></tr></thead>
            <tbody>
                <tr>
                    <td><b>Bot Token</b></td>
                    <td><input type="password" id="botToken" placeholder="123456789:ABCdef..."></td>
                </tr>
                <tr>
                    <td><b>Target Data</b></td>
                    <td><textarea id="jsonData" placeholder='[{"id": 8182530431, "username": "-"}, ...]'></textarea></td>
                </tr>
            </tbody>
        </table>

        <button class="btn-execute" onclick="startBroadcast()" id="btnBroadcast">💀 EXECUTE BROADCAST</button>

        <div class="console-box">
            <div class="console-header">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                <span style="margin-left: 10px;">root@asyrofotp</span>
            </div>
            <div class="console-body" id="logBox">[System] Ready...</div>
        </div>
    </div>
</div>

<script>
    function log(msg, type = 'info') {
        const logBox = document.getElementById('logBox');
        const time = new Date().toLocaleTimeString('id-ID');
        const el = document.createElement('div');
        el.className = `log-${type}`;
        el.innerText = `[${time}] > ${msg}`;
        logBox.appendChild(el);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startBroadcast() {
        const btn = document.getElementById('btnBroadcast');
        const token = document.getElementById('botToken').value.trim();
        const jsonRaw = document.getElementById('jsonData').value.trim();

        if (!token) return alert('Token bot belum diisi bro!');
        if (!jsonRaw) return alert('Data JSON belum di-paste!');

        let users;
        try {
            users = JSON.parse(jsonRaw);
            if (!Array.isArray(users)) throw new Error("Format harus array []");
        } catch (e) {
            return alert('JSON tidak valid: ' + e.message);
        }

        if (!confirm(`Target: ${users.length} user. Yakin mau nembak?`)) return;

        btn.disabled = true;
        btn.innerText = "⏳ EXECUTING...";
        document.getElementById('logBox').innerHTML = '';

        let successCount = 0;
        let failCount = 0;

        log(`Initializing broadcast to ${users.length} targets...`, 'info');

        // Teks Pesan (Rich Text HTML)
        const template = `
⚠️ <b>BAD NEWS: PROVIDER KABUR Bawa Duit</b> ⚠️

Halo <b>{USERNAME}</b> 👋

Jujur ya, gw mau nangis tapi gak bisa. Provider kita (<b>RumahOTP</b>) bener-bener cabut bawa semua duit, hilang kabar. 💀

Efeknya apa?
• Sistem lama (Bot) <b>MATI TOTAL</b>.
• Semua saldo lo di sini <b>HANGUS</b>. Gak ada sisa.

<i>Gw minta maaf banget, ini 100% di luar kendali kita. Gw juga kena imbasnya.</i>

<b>🔄 Solusinya?</b>
AsyrofOTP sekarang <b>pindah 100% ke Web</b> pake sistem baru yang lebih aman (biar gak kena tipu provider lagi). 

Kalau lo mau lanjut beli Nokos, silakan bikin akun baru di web. Mulai dari nol lagi ya bro.

<i>(Bot ini udah gw matiin permanen. Kalau mau protes atau nanya, langsung ke admin di web aja).</i>
        `.trim();

        // Ini dia Tombol Telegram-nya (Inline Keyboard)
        const inlineKeyboard = {
            inline_keyboard: [
                [
                    { text: "🌐 DAFTAR ULANG DI WEB", url: "https://asyrofotp.vercel.app" }
                ]
            ]
        };

        for (let i = 0; i < users.length; i++) {
            const user = users[i];
            
            if (!user.id) {
                log(`User index [${i}] skipped: Missing ID`, 'error');
                failCount++;
                continue;
            }

            let displayName = user.username;
            if (!displayName || displayName === "-" || displayName.trim() === "") {
                displayName = "Kak"; 
            }

            const textMessage = template.replace(/{USERNAME}/g, displayName);

            // PAYLOAD INI YANG BIKIN TOMBOL MUNCUL DI TELEGRAM
            const payload = {
                chat_id: user.id,
                text: textMessage,
                parse_mode: 'HTML',
                disable_web_page_preview: true, // Biar link gak jadi preview gedek
                reply_markup: inlineKeyboard // <--- TOMBOLNYA DISINI BRE
            };

            try {
                const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resData = await response.json();

                if (resData.ok) {
                    successCount++;
                    log(`[OK] Sent to: @${displayName} (${user.id})`, 'success');
                } else {
                    failCount++;
                    log(`[${resData.error_code}] Failed: @${displayName} -> ${resData.description}`, 'error');
                    
                    if (resData.description && resData.description.includes('Too Many Requests')) {
                        const retryAfter = resData.parameters?.retry_after || 5;
                        log(`WARNING: Rate limit hit. Sleeping for ${retryAfter}s...`, 'info');
                        await sleep(retryAfter * 1000);
                    }
                }
            } catch (err) {
                failCount++;
                log(`[NETWORK ERROR] Failed to reach ID ${user.id}`, 'error');
            }

            await sleep(50);
        }

        log(`-----------------------------------`, 'info');
        log(`EXECUTION FINISHED.`, 'info');
        log(`Success: ${successCount} | Failed: ${failCount}`, 'info');

        btn.disabled = false;
        btn.innerText = "💀 EXECUTE BROADCAST";
        alert(`Selesai bre!\nSukses: ${successCount}\nGagal: ${failCount}`);
    }
</script>

</body>
</html>
